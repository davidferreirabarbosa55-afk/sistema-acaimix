# Configuração do Fly.io para a Açaí Mix.
# O nome do app ("app") é definido no primeiro "fly launch"; troque se já estiver em uso.
app = "acai-mix"
primary_region = "gru"            # São Paulo: a região do Fly mais perto de Petrolina
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]

[env]
  NODE_ENV = "production"
  PORTA = "3000"
  PASTA_DADOS = "/data"
  CONFIAR_PROXY = "true"          # o Fly informa o IP real do cliente (usado no limite de tentativas)
  FUSO_HORARIO = "-3"
  RETENCAO_DIAS = "180"
  NOME_FATURA = "ACAIMIX"
  # Senhas e chaves NÃO vão aqui: use "fly secrets set" (veja DEPLOY-FLY.md)

# Disco persistente: guarda o banco de dados e as fotos dos produtos.
[mounts]
  source = "acaimix_dados"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Sempre ligado: a tela da cozinha fica conectada o dia todo e o primeiro cliente
  # não espera a máquina "acordar". Custa poucos dólares por mês.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/saude"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
